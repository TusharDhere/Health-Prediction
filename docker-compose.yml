services:
  mira:
    build: .
    container_name: mira-health-app
    ports:
      - "5000:5000"
    volumes:
      - mira_data:/data
    environment:
      - PORT=5000
      - DATA_DIR=/data
      - JWT_SECRET=mira-health-platform-jwt-secret-key-2025-production-secure-64chars!!
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mira_data:
    driver: local
