# ─────────────────────────────────────────────────────────────────
#  render.yaml — MIRA full blueprint
#  Includes: Web Service + Free PostgreSQL database
#  Data survives all redeploys, restarts, and outages.
# ─────────────────────────────────────────────────────────────────

databases:
  - name: mira-db
    plan: free          # Render free PostgreSQL (90-day trial, then $7/mo)
    databaseName: mira
    user: mira_admin

services:
  - type: web
    name: mira-health-app
    runtime: python
    region: oregon

    buildCommand: bash build.sh
    startCommand: bash start.sh

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mira-db
          property: connectionString   # auto-injected by Render
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"

    healthCheckPath: /health
